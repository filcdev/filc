[run]
bun = true

[fmt]
printWidth = 80
tabWidth = 2
useTabs = false
semi = true
singleQuote = true
trailingComma = "es5"
bracketSpacing = true
bracketSameLine = false
arrowParens = "always"
quoteProps = "as-needed"
jsxSingleQuote = false
endOfLine = "lf"
sortImports = true
sortTailwindcss = true
ignorePatterns = [
  "apps/chronos/src/database/migrations/",
  "apps/chronos/openapi/",
  "apps/iris/src/routeTree.gen.ts",
  "apps/kiosk/src/route-tree.gen.ts",
]
