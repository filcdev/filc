# Throwaway PostgreSQL 18 for the E2E suite. `tmpfs` keeps every restart
# fast and guarantees nothing survives a test run.
#
#   docker compose up -d
#
# Host port 55433 is deliberately outside the dev stack (5432 / 55432), so
# the E2E suite never touches developer data.
services:
  postgres:
    image: postgres:18-alpine
    container_name: filc-e2e-postgres
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20