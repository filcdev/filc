user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            return 200;
        }

        # The scanner owns the /scan prefix, the same way chronos owns /api:
        # the platform keeps paths as-is and the app answers under its prefix.
        location = /scan {
            return 301 /scan/;
        }

        location /scan/ {
            try_files $uri $uri/ /scan/index.html;
        }

        location / {
            return 404;
        }
    }
}
