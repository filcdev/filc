user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            return 200;
        }

        # The scanner is served under /scan. The platform may or may not strip
        # that prefix, so both forms resolve to the same built files.
        location = /scan {
            return 301 /scan/;
        }

        location /scan/ {
            rewrite ^/scan/(.*)$ /$1 break;
            try_files $uri $uri/ /index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /index.html;
    }
}
