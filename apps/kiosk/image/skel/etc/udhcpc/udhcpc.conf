# /etc is read-only on a box, and busybox's udhcpc script writes a temporary
# file next to the target and renames it, so the default /etc/resolv.conf can
# never be written: the box came up with no resolver at all and could not
# resolve its own page or the Chronos API. /run is tmpfs; setup.sh points
# /etc/resolv.conf at the same file.
RESOLV_CONF=/run/resolv.conf
