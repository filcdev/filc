# Kiosk clock. Boxes lose power with no clean shutdown, so step the clock hard
# at boot instead of slewing towards it: the TV page decides which lessons and
# substitutions are still upcoming from the system clock.
pool pool.ntp.org iburst
makestep 1.0 3
rtcsync
# The rootfs is read-only; /var/tmp is tmpfs.
driftfile /var/tmp/chrony.drift
