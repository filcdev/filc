name: Feature request
description: Propose a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and motivation
      description: What problem does this solve? Who is affected, and how?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Include user-facing behavior and rough scope.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider, and why is this approach better?
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Chronos (API)
        - Iris (frontend)
        - Infra / CI
        - Docs
        - Other
    validations:
      required: true
