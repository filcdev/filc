name: Bug report
description: Report a bug in Filc
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal, concrete steps that trigger the bug.
      placeholder: |
        1. Start the dev environment (`bun run dev`)
        2. Navigate to ...
        3. Click ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Chronos (API)
        - Iris (frontend)
        - Infra / CI
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, device, app versions. Paste output of `bun --version` if relevant.
      placeholder: e.g. Chrome 130 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste relevant server/browser logs or attach screenshots.
