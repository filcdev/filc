version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 10
    groups:
      actions-patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
